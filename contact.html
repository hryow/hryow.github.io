    <body class="page-contact">
    <!-- navigation bar -->
    <nav id="navbar">
        <div id="name">
            <h1> <a href="index.html">hayoung ryow </a></h1>
        </div>

        <!-- navbar links -->
        <div id="links">
            <ul id="navbar-links">
                <li> <a href="projects.html">projects</a></li>
                <li> <a href="about.html">about</a></li>
                <li> <a href="experience.html">experience</a></li>
                <li> <a href="contact.html"><strong>contact</strong></a></li>
            </ul>
        </div>
    </nav>

    <button id="myBtn" title="Go to top">↑</button>

    <main>
        <h5> contact me! </h5>
        <div class="wrapper">
          <p> I can be reached by email at <a href="mailto:hayoung.ryow@gmail.com">hayoung.ryow@gmail.com</a>, by phone at (909) 497-4685, or through the form below:</p>
          <form id="contactForm"
                action="mailto:hayoung.ryow@gmail.com"
                method="post"
                enctype="text/plain"
                novalidate>
              <div class="form-group">
                  <label for="contact-name">name</label>
                  <br>
                  <input type="text" id="contact-name"
                         name="name" 
                         placeholder="your name here" autocomplete="name" required>
                  <span class="error-message" id="nameError"></span>
              </div>
              <div class="form-group">
                  <label for="email">email</label>
                  <br>
                  <input type="email" id="email" 
                         name="email" 
                         placeholder="your email here" autocomplete="email" required>
                  <span class="error-message" id="emailError"></span>
              </div>
              <div class="form-group">
                  <label for="phone">phone</label>
                  <br>
                  <input type="tel" id="phone"
                         name="phone" 
                         placeholder="your phone number here" autocomplete="tel" required>
                  <span class="error-message" id="phoneError"></span>
              </div>
              <div class="form-group">
                  <label for="message">message</label>
                  <br>
                  <textarea id="message" 
                            name="message" 
                            placeholder="write your message to me!"
                            autocomplete="off"
                            rows="5" required></textarea>
                  <span class="error-message" 
                        id="messageError"></span>
              </div>
              <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
              <button type="submit"
                      class="submit-button">
                + send +
              </button>
          </form>
        </div>
        <br>
        <br>

    </main>
  </body>
</html>
